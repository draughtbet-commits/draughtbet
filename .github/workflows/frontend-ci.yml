name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/**'

jobs:
  lint-design-system:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Enforce AppColors usage (ban raw Colors.*)
      run: |
        if grep -rn '\bColors\.' lib/ --include="*.dart" | grep -v "lib/theme/"; then
          echo "Error: Raw Colors.* usage found outside lib/theme/. Please use AppColors tokens instead."
          exit 1
        else
          echo "Design system color usage verified."
        fi
